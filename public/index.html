<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>My AI Chatbot</title>

  <style>
    :root {
      --kitty-red: #e63956;
      --kitty-dark-red: #c92e48;
      --kitty-pink: #ffb6c8;
      --kitty-light-pink: #fff0f5;
      --kitty-soft-pink: #ffe1ea;
      --kitty-white: #ffffff;
      --kitty-cream: #fffaf5;
      --kitty-text: #5f3c46;
      --kitty-muted: #a76f7f;
      --kitty-border: #f4b5c5;
      --kitty-shadow: rgba(208, 75, 111, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: var(--kitty-text);
      background:
        radial-gradient(circle at 10% 20%, #ffffff 0 4px, transparent 5px),
        radial-gradient(circle at 80% 30%, #ffffff 0 3px, transparent 4px),
        linear-gradient(135deg, #fff7fa, #ffe7ef);
      background-size: 70px 70px, 90px 90px, auto;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */

    .sidebar {
      width: 260px;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      color: var(--kitty-text);
      background: linear-gradient(
        180deg,
        var(--kitty-soft-pink),
        var(--kitty-light-pink)
      );
      border-right: 2px solid var(--kitty-border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 24px;
      font-weight: 800;
      color: var(--kitty-red);
    }

    .logo-cat {
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      font-size: 24px;
      background: white;
      border: 2px solid var(--kitty-border);
      border-radius: 50%;
      box-shadow: 0 5px 12px var(--kitty-shadow);
    }

    .new-chat-button {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid var(--kitty-red);
      border-radius: 999px;
      background: white;
      color: var(--kitty-red);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .new-chat-button:hover {
      color: white;
      background: var(--kitty-red);
      transform: translateY(-2px);
      box-shadow: 0 7px 16px var(--kitty-shadow);
    }

    .sidebar-info {
      margin-top: auto;
      padding: 14px;
      color: var(--kitty-muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--kitty-border);
      border-radius: 18px;
    }

    /* Main */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 2px solid var(--kitty-border);
      backdrop-filter: blur(12px);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--kitty-red);
      font-size: 19px;
      font-weight: 800;
    }

    .header-icon {
      font-size: 22px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--kitty-muted);
      font-size: 14px;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #72d6a0;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #a8e8c5;
    }

    /* Chat */

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 160px;
    }

    .chat {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome {
      margin-top: 65px;
      padding: 26px;
      text-align: center;
    }

    .welcome-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 92px;
      height: 82px;
      margin: 0 auto 22px;
      font-size: 48px;
      background: white;
      border: 3px solid var(--kitty-border);
      border-radius: 45% 45% 42% 42%;
      box-shadow: 0 12px 28px var(--kitty-shadow);
    }

    .kitty-bow {
      position: absolute;
      top: -12px;
      right: -11px;
      font-size: 30px;
      transform: rotate(10deg);
    }

    .welcome h1 {
      margin-bottom: 10px;
      color: var(--kitty-red);
      font-size: 32px;
    }

    .welcome p {
      color: var(--kitty-muted);
      line-height: 1.7;
    }

    .message-row {
      display: flex;
      margin-bottom: 22px;
      animation: fadeIn 0.25s ease;
    }

    .user-row {
      justify-content: flex-end;
    }

    .assistant-row {
      justify-content: flex-start;
    }

    .message {
      max-width: 76%;
      padding: 14px 17px;
      border-radius: 22px;
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user-message {
      color: white;
      background: linear-gradient(
        135deg,
        var(--kitty-red),
        #f05b75
      );
      border-bottom-right-radius: 6px;
      box-shadow: 0 7px 18px var(--kitty-shadow);
    }

    .assistant-message {
      color: var(--kitty-text);
      background: white;
      border: 2px solid var(--kitty-border);
      border-bottom-left-radius: 6px;
      box-shadow: 0 7px 18px rgba(180, 87, 111, 0.1);
    }

    .loading-message {
      color: var(--kitty-muted);
      font-style: italic;
    }

    /* Input */

    .input-area {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 260px;
      padding: 22px;
      background: linear-gradient(
        to top,
        #fff0f5 72%,
        rgba(255, 240, 245, 0)
      );
    }

    .input-wrapper {
      max-width: 850px;
      margin: 0 auto;
    }

    .chat-form {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 18px;
      background: white;
      border: 2px solid var(--kitty-border);
      border-radius: 26px;
      box-shadow: 0 12px 30px var(--kitty-shadow);
    }

    .chat-form:focus-within {
      border-color: var(--kitty-red);
    }

    #message-input {
      flex: 1;
      min-width: 0;
      padding: 11px 0;
      border: none;
      outline: none;
      color: var(--kitty-text);
      background: transparent;
      font-size: 16px;
    }

    #message-input::placeholder {
      color: #ca91a2;
    }

    #send-button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      color: white;
      background: var(--kitty-red);
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #send-button:hover {
      background: var(--kitty-dark-red);
      transform: scale(1.06) rotate(-5deg);
    }

    #send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .input-note {
      margin-top: 10px;
      color: var(--kitty-muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .input-area {
        left: 0;
      }

      .header {
        padding: 0 17px;
      }

      .chat-container {
        padding: 22px 13px 145px;
      }

      .message {
        max-width: 88%;
      }

      .welcome {
        margin-top: 35px;
      }

      .welcome h1 {
        font-size: 27px;
      }
    }
    .message-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .copy-button {
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--pink-6);
      background: var(--pink-1);
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .copy-button:hover {
      color: white;
      background: var(--pink-5);
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-cat">🎀</span>
        Kitty AI
      </div>

      <button class="new-chat-button" id="new-chat-button">
        ＋ New chat
      </button>

      <div class="sidebar-info">
        Built with Node.js, Express and the OpenAI API.
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-title">
          <span class="header-icon">🐱</span>
          Kitty Assistant
        </div>

        <div class="status">
          <span class="status-dot"></span>
          Online
        </div>
      </header>

      <section class="chat-container" id="chat-container">
        <div class="chat" id="chat">
          <div class="welcome" id="welcome">
            <div class="welcome-icon">✦</div>

            <h1>How can I help you?</h1>

            <p>
              Ask a question, request an explanation, or start a
              conversation.
            </p>
          </div>
        </div>
      </section>

      <div class="input-area">
        <div class="input-wrapper">
          <form class="chat-form" id="chat-form">
            <input
              id="message-input"
              type="text"
              placeholder="Message Kitty AI..."
              autocomplete="off"
              required
            />

            <button id="send-button" type="submit" aria-label="Send message">
              ♥
            </button>
          </form>

          <div class="input-note">
            AI may make mistakes. Check important information.
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const chat = document.getElementById("chat");
    const chatContainer =
      document.getElementById("chat-container");
    const sendButton =
      document.getElementById("send-button");
    const newChatButton =
      document.getElementById("new-chat-button");

    let previousResponseId = null;

    function saveChat() {
      localStorage.setItem("kittyChatHtml", chat.innerHTML);

      if (previousResponseId) {
        localStorage.setItem(
          "kittyPreviousResponseId",
          previousResponseId
        );
      } else {
        localStorage.removeItem(
          "kittyPreviousResponseId"
        );
      }
    }

    function loadChat() {
      const savedChat =
        localStorage.getItem("kittyChatHtml");

      const savedResponseId =
        localStorage.getItem(
          "kittyPreviousResponseId"
        );

      if (savedChat) {
        chat.innerHTML = savedChat;
      }

      if (savedResponseId) {
        previousResponseId = savedResponseId;
      }

      scrollToBottom();
    }

    function removeWelcomeMessage() {
      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }
    }

    function scrollToBottom() {
      chatContainer.scrollTop =
        chatContainer.scrollHeight;
    }

    function displayMessage(text, sender) {
      removeWelcomeMessage();

      const row = document.createElement("div");
      const message = document.createElement("div");

      row.className =
        sender === "user"
          ? "message-row user-row"
          : "message-row assistant-row";

      message.className =
        sender === "user"
          ? "message user-message"
          : "message assistant-message";

      message.textContent = text;
      message.dataset.time = getCurrentTime();

      if (sender === "assistant") {
        const actions = document.createElement("div");
        const copyButton =
          document.createElement("button");

        actions.className = "message-actions";
        copyButton.className = "copy-button";
        copyButton.type = "button";
        copyButton.textContent = "Copy";
        copyButton.dataset.copyText = text;

        actions.appendChild(copyButton);
        message.appendChild(actions);
      }

      row.appendChild(message);
      chat.appendChild(row);

      scrollToBottom();
      saveChat();

      return row;
    }

    chat.addEventListener("click", async (event) => {
      const copyButton =
        event.target.closest(".copy-button");

      if (!copyButton) {
        return;
      }

      try {
        await navigator.clipboard.writeText(
          copyButton.dataset.copyText
        );

        copyButton.textContent = "Copied!";

        setTimeout(() => {
          copyButton.textContent = "Copy";
        }, 1500);
      } catch {
        copyButton.textContent = "Failed";
      }
    });

    function displayLoadingMessage() {
      const row = displayMessage(
        "AI is thinking...",
        "assistant"
      );

      const message = row.querySelector(".message");
      message.classList.add("loading-message");

      return row;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message) {
        return;
      }

      displayMessage(message, "user");

      input.value = "";
      input.focus();
      sendButton.disabled = true;

      const loadingRow = displayLoadingMessage();

      try {
        const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            message,
            previousResponseId,
        }),
        });

        if (!response.ok) {
        const data = await response.json();

        throw new Error(
            data.error || "Request failed."
        );
        }

        loadingRow.remove();

        const assistantRow = displayMessage("", "assistant");
        const assistantMessage =
        assistantRow.querySelector(".message");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let fullText = "";

        while (true) {
        const { value, done } = await reader.read();

        if (done) {
            break;
        }

        const chunk = decoder.decode(value, {
            stream: true,
        });

        fullText += chunk;
        assistantMessage.textContent = fullText;

        scrollToBottom();
        }

        const newResponseId =
        response.headers.get("X-Response-Id");

        if (newResponseId) {
        previousResponseId = newResponseId;
        }

      } catch (error) {
        loadingRow.remove();

        displayMessage(
          `Error: ${error.message}`,
          "assistant"
        );
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });

    newChatButton.addEventListener("click", () => {
      previousResponseId = null;
      localStorage.removeItem("kittyChatHtml");
      localStorage.removeItem(
      "kittyPreviousResponseId"
      );
      chat.innerHTML = `
        <div class="welcome" id="welcome">
          <div class="welcome-icon">
            <span class="kitty-face">🐱</span>
            <span class="kitty-bow">🎀</span>
          </div>

          <h1>Hello, cutie!</h1>

          <p>
            Ask Kitty AI anything you would like to learn or talk about.
          </p>
        </div>
      `;

      input.value = "";
      input.focus();

      saveChat();
    });
    loadChat();
  </script>
</body>
</html>
